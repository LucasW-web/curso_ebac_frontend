<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <div class="row">
        <div class="col">
            <h2>Entre em Contato</h2>
            <form>
                <label for="nome" class="form-label">seu nome:</label>
                <input  id="nome" type="text" class="form-control">
                <label for="email" class="form-label">seu email:</label>
                <input id="email" type="email" class="form-control">
                <label for="tel" class="form-label">seu número:</label>
                <input id="tel" type="tell" class="form-control">
                <div class="form-check form-switch">
                    <label for="aceito-termos" class="form-check-label">Li e concordo com os termos do site</label>
                    <input type="checkbox" class="form-check-input" id="aceito-termos">
                </div>
                <button class="btn btn-success">enviar</button>
            </form>
        </div>
    </div>
    
    
</body>
</html>
